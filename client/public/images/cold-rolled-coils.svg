<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E242B"/>
      <stop offset="50%" stop-color="#283038"/>
      <stop offset="100%" stop-color="#181C21"/>
    </linearGradient>
    <linearGradient id="coilOuter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#717A84"/>
      <stop offset="25%" stop-color="#A6B0BA"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="75%" stop-color="#88929D"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <linearGradient id="coilInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Background Factory Floor -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Perspective Floor Lines -->
  <path d="M0 380 L800 380 L800 500 L0 500 Z" fill="#1C2127"/>
  <line x1="100" y1="380" x2="0" y2="500" stroke="#2D353F" stroke-width="2"/>
  <line x1="300" y1="380" x2="200" y2="500" stroke="#2D353F" stroke-width="2"/>
  <line x1="500" y1="380" x2="600" y2="500" stroke="#2D353F" stroke-width="2"/>
  <line x1="700" y1="380" x2="800" y2="500" stroke="#2D353F" stroke-width="2"/>

  <!-- Background Coil (Back Left) -->
  <g transform="translate(140, 220) scale(0.75)">
    <ellipse cx="140" cy="140" rx="140" ry="90" fill="#4B5563"/>
    <ellipse cx="140" cy="140" rx="135" ry="85" fill="#6B7280"/>
    <ellipse cx="140" cy="140" rx="45" ry="30" fill="#1F2937"/>
  </g>

  <!-- Background Coil (Back Right) -->
  <g transform="translate(480, 220) scale(0.75)">
    <ellipse cx="140" cy="140" rx="140" ry="90" fill="#4B5563"/>
    <ellipse cx="140" cy="140" rx="135" ry="85" fill="#6B7280"/>
    <ellipse cx="140" cy="140" rx="45" ry="30" fill="#1F2937"/>
  </g>

  <!-- Main Front Cold Rolled Steel Coil -->
  <g transform="translate(260, 160)">
    <!-- Shadow -->
    <ellipse cx="140" cy="235" rx="170" ry="25" fill="#0A0D10" opacity="0.6"/>

    <!-- Outer Cylinder Body -->
    <path d="M0 120 C 0 60, 280 60, 280 120 L 280 200 C 280 260, 0 260, 0 200 Z" fill="url(#coilOuter)"/>

    <!-- Concentric Spiral Windings -->
    <ellipse cx="140" cy="120" rx="140" ry="60" fill="url(#coilOuter)" stroke="#4B5563" stroke-width="1.5"/>
    <ellipse cx="140" cy="120" rx="130" ry="55" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <ellipse cx="140" cy="120" rx="115" ry="48" fill="none" stroke="#64748B" stroke-width="1"/>
    <ellipse cx="140" cy="120" rx="95" ry="40" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    <ellipse cx="140" cy="120" rx="75" ry="32" fill="none" stroke="#64748B" stroke-width="1.5"/>

    <!-- Inner Core Hole -->
    <ellipse cx="140" cy="120" rx="55" ry="24" fill="url(#coilInner)"/>
    <ellipse cx="140" cy="120" rx="50" ry="21" fill="#0A0D10"/>

    <!-- Steel Strapping Bands (Commercial Packaging) -->
    <rect x="55" y="105" width="10" height="95" fill="url(#bandGrad)" opacity="0.95"/>
    <rect x="215" y="105" width="10" height="95" fill="url(#bandGrad)" opacity="0.95"/>
  </g>

  <!-- Technical Spec Watermark Overlay -->
  <rect x="20" y="20" width="160" height="32" rx="4" fill="#0F172A" opacity="0.8"/>
  <text x="32" y="41" fill="#FFAA00" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="1">IS 513:2016 CR1</text>
  
  <rect x="620" y="20" width="160" height="32" rx="4" fill="#0F172A" opacity="0.8"/>
  <text x="635" y="41" fill="#10B981" font-family="'Inter', sans-serif" font-size="12" font-weight="800">MILL CERTIFIED</text>
</svg>
