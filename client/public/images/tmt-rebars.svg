    <rect x="40" y="120" width="620" height="24" rx="12" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <rect x="60" y="160" width="580" height="24" rx="12" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
