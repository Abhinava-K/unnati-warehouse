  <rect x="20" y="20" width="190" height="32" rx="4" fill="#0F172A" opacity="0.8"/>
  <text x="32" y="41" fill="#FFAA00" font-family="'Inter', sans-serif" font-size="12" font-weight="800">AL 99.7% PURITY</text>
