<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="whGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14191E"/>
      <stop offset="60%" stop-color="#1F262D"/>
      <stop offset="100%" stop-color="#0E1216"/>
    </linearGradient>
    <linearGradient id="rackBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="palletBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Massive Dark Logistics Warehouse -->
  <rect width="800" height="500" fill="url(#whGrad)"/>

  <!-- Warehouse Roof Rafters & Lighting Fixtures -->
  <g stroke="#334155" stroke-width="3" opacity="0.6">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="120" y1="0" x2="120" y2="120"/>
    <line x1="280" y1="0" x2="280" y2="120"/>
    <line x1="440" y1="0" x2="440" y2="120"/>
    <line x1="600" y1="0" x2="600" y2="120"/>
    <line x1="760" y1="0" x2="760" y2="120"/>
  </g>

  <!-- Industrial Hanging High-Bay Lamps -->
  <circle cx="200" cy="90" r="8" fill="#FEF08A" opacity="0.9"/>
  <polygon points="170,180 230,180 200,90" fill="#FEF08A" opacity="0.08"/>
  
  <circle cx="500" cy="90" r="8" fill="#FEF08A" opacity="0.9"/>
  <polygon points="470,180 530,180 500,90" fill="#FEF08A" opacity="0.08"/>

  <!-- Multi-Tier 3PL Heavy Duty Pallet Racking (Left Side) -->
  <g transform="translate(40, 100)">
    <!-- Uprights (Blue Steel) -->
    <rect x="0" y="0" width="12" height="380" fill="#1E3A8A"/>
    <rect x="180" y="0" width="12" height="380" fill="#1E3A8A"/>
    <!-- Orange Beams -->
    <rect x="0" y="90" width="192" height="12" fill="url(#rackBeam)"/>
    <rect x="0" y="190" width="192" height="12" fill="url(#rackBeam)"/>
    <rect x="0" y="290" width="192" height="12" fill="url(#rackBeam)"/>
    <!-- Pallet Cargo Boxes -->
    <rect x="20" y="20" width="150" height="68" rx="3" fill="url(#palletBox)" stroke="#64748B"/>
    <rect x="20" y="120" width="150" height="68" rx="3" fill="url(#palletBox)" stroke="#64748B"/>
    <rect x="20" y="220" width="150" height="68" rx="3" fill="url(#palletBox)" stroke="#64748B"/>
    <!-- Shrink wrap bands -->
    <line x1="20" y1="54" x2="170" y2="54" stroke="#475569" stroke-width="2"/>
    <line x1="20" y1="154" x2="170" y2="154" stroke="#475569" stroke-width="2"/>
    <line x1="20" y1="254" x2="170" y2="254" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Multi-Tier Heavy Duty Pallet Racking (Right Side) -->
  <g transform="translate(560, 100)">
    <rect x="0" y="0" width="12" height="380" fill="#1E3A8A"/>
    <rect x="180" y="0" width="12" height="380" fill="#1E3A8A"/>
    <rect x="0" y="90" width="192" height="12" fill="url(#rackBeam)"/>
    <rect x="0" y="190" width="192" height="12" fill="url(#rackBeam)"/>
    <rect x="0" y="290" width="192" height="12" fill="url(#rackBeam)"/>
    <rect x="20" y="20" width="150" height="68" rx="3" fill="url(#palletBox)" stroke="#64748B"/>
    <rect x="20" y="120" width="150" height="68" rx="3" fill="url(#palletBox)" stroke="#64748B"/>
    <rect x="20" y="220" width="150" height="68" rx="3" fill="url(#palletBox)" stroke="#64748B"/>
  </g>

  <!-- Center Aisle Floor -->
  <polygon points="260,200 520,200 680,500 100,500" fill="#1B2228"/>
  <line x1="390" y1="200" x2="390" y2="500" stroke="#F59E0B" stroke-width="3" stroke-dasharray="16 12"/>

  <!-- Modern Industrial Counterbalance Forklift (Center-Right in Aisle) -->
  <g transform="translate(330, 270) scale(0.9)">
    <!-- Wheels -->
    <circle cx="50" cy="150" r="22" fill="#111827" stroke="#374151" stroke-width="4"/>
    <circle cx="150" cy="150" r="18" fill="#111827" stroke="#374151" stroke-width="4"/>
    <!-- Yellow Chassis Body -->
    <path d="M40 135 L140 135 L165 110 L150 70 L95 70 L95 30 L60 30 L35 70 Z" fill="#F59E0B"/>
    <!-- Overhead Guard Roll Cage -->
    <path d="M65 30 L65 -15 L120 -15 L110 70" fill="none" stroke="#1E293B" stroke-width="6"/>
    <!-- Operator Seat & Steering -->
    <rect x="75" y="45" width="22" height="25" rx="3" fill="#111827"/>
    <!-- Vertical Mast & Forks -->
    <rect x="170" y="-30" width="8" height="175" fill="#334155"/>
    <rect x="178" y="90" width="55" height="8" fill="#64748B"/>
    <!-- Carried Wooden Pallet -->
    <rect x="185" y="70" width="50" height="18" fill="#B45309"/>
    <rect x="188" y="30" width="45" height="38" fill="#E2E8F0" stroke="#94A3B8"/>
  </g>
</svg>
