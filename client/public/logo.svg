<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <!-- Bar Gradients -->
    <linearGradient id="logoBar1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF4D00" />
    </linearGradient>

    <linearGradient id="logoBar2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>

    <linearGradient id="logoBar3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC400" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <linearGradient id="logoBarDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Top Arch Gradient (Blue to Lime Green) -->
    <linearGradient id="logoTopArch" x1="0%" y1="80%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Bottom Arc Gradient (Deep Blue to Cyan) -->
    <linearGradient id="logoBottomArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C9C" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00357A" />
    </linearGradient>

    <!-- Green Rising Arrow Gradient -->
    <linearGradient id="logoRisingArrow" x1="0%" y1="70%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="25%" stop-color="#0D9488" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Chain Link Gradients -->
    <linearGradient id="logoChain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4894" />
      <stop offset="100%" stop-color="#062F69" />
    </linearGradient>
    
    <linearGradient id="logoChain2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0E4894" />
    </linearGradient>

    <linearGradient id="logoChain3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="logoChain4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
  </defs>

  <!-- ================= EMBLEM ================= -->
  <g id="emblem-group" transform="translate(20, 20)">
    <!-- 1. CHART BARS -->
    <!-- Bar 1 (Left, Orange) -->
    <rect x="132" y="145" width="24" height="42" rx="3.5" fill="url(#logoBar1)" />
    <rect x="132" y="193" width="24" height="24" rx="2" fill="url(#logoBarDark)" />

    <!-- Bar 2 (Middle, Amber) -->
    <rect x="166" y="118" width="26" height="60" rx="3.5" fill="url(#logoBar2)" />
    <rect x="166" y="184" width="26" height="33" rx="2" fill="url(#logoBarDark)" />

    <!-- Bar 3 (Right, Golden Yellow) -->
    <rect x="202" y="88" width="28" height="78" rx="3.5" fill="url(#logoBar3)" />
    <rect x="202" y="172" width="28" height="45" rx="2" fill="url(#logoBarDark)" />

    <!-- 2. TOP BLUE-TO-GREEN ARCH -->
    <path d="M 130,105 C 148,78 190,65 232,74 C 250,78 268,86 282,98 C 263,90 240,84 218,83 C 178,81 148,92 130,105 Z" 
          fill="url(#logoTopArch)" />

    <!-- 3. BOTTOM-LEFT SWOOPING BLUE ARC -->
    <path d="M 94,152 C 86,175 87,202 101,224 C 114,244 136,257 163,262 C 152,256 139,248 131,237 C 115,217 113,190 119,166 C 122,154 127,142 133,132 C 118,136 103,142 94,152 Z" 
          fill="url(#logoBottomArc)" />

    <path d="M 84,165 C 77,188 81,212 96,230 C 109,246 128,258 150,263 C 133,256 118,243 107,226 C 96,208 94,186 100,166 C 103,160 106,155 110,150 C 99,154 90,159 84,165 Z" 
          fill="#0A3272" opacity="0.6" />

    <!-- 4. RISING GREEN ARROW RIBBON -->
    <path d="M 86,168 C 90,185 112,189 133,185 C 166,179 204,162 240,138 C 268,120 293,98 312,75 L 314,94 L 348,54 L 289,64 L 307,77 C 286,98 257,122 227,140 C 190,164 154,177 124,178 C 105,179 90,176 86,168 Z" 
          fill="url(#logoRisingArrow)" />

    <!-- 5. INDUSTRIAL CHAIN LINKS (BOTTOM TO TOP RIGHT) -->
    <!-- Link 1: Bottom Horizontal Deep Blue -->
    <g transform="translate(168, 248) rotate(14)">
      <rect x="-21" y="-8.5" width="42" height="17" rx="8.5" fill="url(#logoChain1)" stroke="#06224D" stroke-width="1.5" />
      <rect x="-10.5" y="-3.5" width="21" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Link 2: Angled Cobalt Blue -->
    <g transform="translate(210, 240) rotate(-22)">
      <rect x="-19" y="-8" width="38" height="16" rx="8" fill="url(#logoChain2)" stroke="#083777" stroke-width="1.5" />
      <rect x="-9.5" y="-3.5" width="19" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Link 3: Transitioning Teal-Green -->
    <g transform="translate(246, 220) rotate(-48)">
      <rect x="-19" y="-8" width="38" height="16" rx="8" fill="url(#logoChain3)" stroke="#04685E" stroke-width="1.5" />
      <rect x="-9.5" y="-3" width="19" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Link 4: Upper Lime Green (leading to arrow) -->
    <g transform="translate(272, 188) rotate(-66)">
      <rect x="-18" y="-8" width="36" height="16" rx="8" fill="url(#logoChain4)" stroke="#057A44" stroke-width="1.5" />
      <rect x="-9" y="-3" width="18" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Accent highlight link connecting to arrow -->
    <path d="M 270,168 C 273,160 276,152 280,142 C 282,143 285,145 287,148 C 284,157 279,166 275,174 Z" 
          fill="#84CC16" opacity="0.8" />
  </g>

  <!-- ================= "UNNATI" VECTOR TYPOGRAPHY ================= -->
  <!-- Crisp, scalable bold geometric sans-serif lettering matching the logo artwork -->
  <g id="brand-text" transform="translate(200, 365)">
    <text text-anchor="middle" 
          font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="4px" 
          fill="#2D3748">
      UNNATI
    </text>
  </g>
</svg>